name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    name: Verify and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Check for a version increment
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] || ! git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - if: steps.version.outputs.publish == 'true'
        run: python -m pip install -r server/requirements.txt
      - if: steps.version.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v
      - if: steps.version.outputs.publish == 'true'
        run: python -m py_compile web.py server/app.py server/game_state.py server/store.py
      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - if: steps.version.outputs.publish == 'true'
        working-directory: client
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        working-directory: client
        run: npm run build
      - if: steps.version.outputs.publish == 'true'
        name: Verify production image
        run: docker build -t snow-dash:release .
      - name: Verify the merged revision in the live multiplayer service
        if: steps.version.outputs.publish == 'true' && github.event_name == 'workflow_run'
        env:
          SMOKE_URL: https://christmas-game-za00.onrender.com
        run: |
          target=$(git rev-parse HEAD)
          live=""
          for attempt in {1..60}; do
            live=$(curl -fsS --max-time 10 "$SMOKE_URL/health" | jq -r '.revision // empty') || true
            [[ "$live" == "$target" ]] && break
            sleep 10
          done
          [[ "$live" == "$target" ]]
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/browser_smoke.py
      - if: steps.version.outputs.publish == 'true'
        name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            version=$(cat VERSION)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            gh release create "$version" --target "$(git rev-parse HEAD)" --generate-notes
          fi
